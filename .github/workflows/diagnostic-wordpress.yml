name: Diagnostic WordPress Lumen Juris

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/diagnostic-wordpress.txt'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      WP_SITE: ${{ secrets.WP_SITE }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Vérifier les URLs REST sans modification
        shell: bash
        run: |
          set +e
          for URL in "$WP_SITE/wp-json/" "$WP_SITE/wp-json/wp/v2/pages?per_page=1" "$WP_SITE/wp-json/wp/v2/media?per_page=1"; do
            echo "===== $URL ====="
            curl -sS --max-redirs 0 -D - -o /dev/null "$URL" | grep -iE '^(HTTP/|location:|server:)' || true
          done

      - name: Tester authentification REST en lecture seule
        shell: bash
        run: |
          CODE=$(curl -sS --max-redirs 0 -u "admin:$WP_APP_PASSWORD" -o /tmp/auth.json -w '%{http_code}' "$WP_SITE/wp-json/wp/v2/users/me?context=edit")
          echo "HTTP_AUTH=$CODE"
          if [ "$CODE" = "200" ]; then
            echo "AUTH_OK=true"
          else
            echo "AUTH_OK=false"
          fi

      - name: Diagnostiquer le POST media sans fichier
        shell: bash
        run: |
          echo "===== POST MEDIA ====="
          curl -sS --max-redirs 0 -X POST \
            -u "admin:$WP_APP_PASSWORD" \
            -H 'Content-Type: application/pdf' \
            -H 'Content-Disposition: attachment; filename="diagnostic.pdf"' \
            -D - -o /tmp/post-media-body.txt \
            "$WP_SITE/wp-json/wp/v2/media" | grep -iE '^(HTTP/|location:|server:)' || true
          echo "BODY_PREVIEW=$(head -c 180 /tmp/post-media-body.txt | tr '\n' ' ')"

      - name: Reproduire urllib avec un fichier invalide
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, urllib.request, urllib.error
          site = os.environ['WP_SITE'].rstrip('/')
          pwd = os.environ['WP_APP_PASSWORD']
          token = base64.b64encode(f'admin:{pwd}'.encode()).decode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(
              f'{site}/wp-json/wp/v2/media',
              data=b'x', method='POST',
              headers={
                  'Authorization': f'Basic {token}',
                  'User-Agent': 'Mozilla/5.0 (LumenJuris maintenance script)',
                  'Content-Type': 'application/octet-stream',
                  'Content-Disposition': 'attachment; filename="diagnostic.invalid"'
              })
          try:
              with urllib.request.build_opener(NoRedirect).open(req, timeout=30) as r:
                  print('PY_STATUS=', r.status)
                  print('PY_LOCATION=', r.headers.get('Location'))
                  print('PY_BODY=', r.read(180).decode('utf-8', 'replace'))
          except urllib.error.HTTPError as e:
              print('PY_STATUS=', e.code)
              print('PY_LOCATION=', e.headers.get('Location'))
              print('PY_BODY=', e.read(180).decode('utf-8', 'replace'))
          PY
