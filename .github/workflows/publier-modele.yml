name: Publier modèle Lumen Juris

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/publier-modele.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      WP_SITE: ${{ secrets.WP_SITE }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

    steps:
      - name: Vérifier les secrets WordPress
        run: |
          if [ -z "$WP_SITE" ] || [ -z "$WP_APP_PASSWORD" ]; then
            echo "Les secrets WP_SITE et/ou WP_APP_PASSWORD ne sont pas configurés dans GitHub Actions."
            exit 2
          fi

      - name: Récupérer la branche WordPress
        uses: actions/checkout@v4
        with:
          ref: wordpress-vitrine
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install python-docx playwright
          python -m playwright install chromium --with-deps
          CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell' | head -n 1)
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "Chrome Headless Shell introuvable"
            exit 4
          fi
          echo "NAVIGATEUR_PDF=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Adapter les redirects WordPress
        working-directory: wordpress-vitrine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('outils/modeles_contrat.py')
          s = p.read_text(encoding='utf-8')
          old = '''    with urllib.request.urlopen(r, timeout=120) as resp:\n        j = json.loads(resp.read().decode("utf-8"))'''
          new = '''    class _PreservePostRedirect(urllib.request.HTTPRedirectHandler):\n        def redirect_request(self, req, fp, code, msg, headers, newurl):\n            if code in (307, 308):\n                return urllib.request.Request(newurl, data=req.data, headers=dict(req.header_items()), method=req.get_method())\n            return super().redirect_request(req, fp, code, msg, headers, newurl)\n    opener = urllib.request.build_opener(_PreservePostRedirect)\n    with opener.open(r, timeout=120) as resp:\n        j = json.loads(resp.read().decode("utf-8"))'''
          if old not in s:
              raise SystemExit('Bloc envoyer_media introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Lire le modèle à publier
        id: slug
        working-directory: wordpress-vitrine
        run: |
          if [ ! -f modeles-contrat/a-publier.txt ]; then
            echo "Aucun modèle à publier."
            exit 3
          fi
          SLUG=$(tr -d '\r\n ' < modeles-contrat/a-publier.txt)
          if [ -z "$SLUG" ]; then
            echo "Aucun modèle à publier."
            exit 3
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Construire le modèle
        working-directory: wordpress-vitrine
        run: python outils/modeles_contrat.py construire "${{ steps.slug.outputs.slug }}"

      - name: Publier sur WordPress
        working-directory: wordpress-vitrine
        shell: bash
        run: |
          set +e
          python outils/modeles_contrat.py publier "${{ steps.slug.outputs.slug }}" --en-ligne --sans-relecture 2>&1 | tee /tmp/publication.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ] && grep -q "429" /tmp/publication.log; then
            sleep 120
            python outils/modeles_contrat.py publier "${{ steps.slug.outputs.slug }}" --en-ligne --sans-relecture
            exit $?
          fi
          exit "$CODE"

      - name: Vérifier la page et le plan du site
        working-directory: wordpress-vitrine
        shell: bash
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          URL="https://www.lumenjuris.com/outil-generation-contrat-ia/modele-contrat/$SLUG/"
          CODE=$(curl -L -s -o /tmp/page.html -w "%{http_code}" "$URL")
          test "$CODE" = "200"
          grep -q 'application/ld+json' /tmp/page.html
          curl -L -s https://www.lumenjuris.com/page-sitemap.xml -o /tmp/sitemap.xml
          grep -q "$URL" /tmp/sitemap.xml

      - name: Enregistrer les fichiers générés et vider le déclencheur
        working-directory: wordpress-vitrine
        shell: bash
        run: |
          printf '' > modeles-contrat/a-publier.txt
          git config user.name "Lumen Juris Bot"
          git config user.email "actions@users.noreply.github.com"
          git add modeles-contrat
          if ! git diff --cached --quiet; then
            git commit -m "Publication cloud ${{ steps.slug.outputs.slug }}"
            git push origin HEAD:wordpress-vitrine
          fi
